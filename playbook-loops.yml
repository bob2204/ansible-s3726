---
- name: Présentation des boucles
  hosts: deby-cli

  tasks:
    - name: Boucle n°1
      ansible.builtin.debug:
        msg: "Stagiaire n°{{ nb + 1 }}: {{ stagiaire }}"
      loop:
        - Bob
        - Curt
        - Pat
        - Loé
      loop_control:
        loop_var: stagiaire
        index_var: nb
