---
- name: Installation de Nginx sur le groupe www
  hosts: www
  become: true

  tasks:
    - name: Installation de nginx
      ansible.builtin.package:
        name: "{{ nginx_package_name }}"

    - name: Paramètrage du service
      ansible.builtin.systemd:
        name: "{{ nginx_service_name }}"
        state: started
        enabled: true

    - name: Copie du template de configuration Nginx
      ansible.builtin.template:
        src: nginx-conf/default.conf.ansible
        dest: /etc/nginx/sites-available/default
      notify: restart_nginx

  handlers:
    - name: Redémarrage Nginx
      ansible.builtin.systemd:
        name: "{{ nginx_service_name }}"
        state: restarted
      listen: restart_nginx

- name: Installation de PHP-FPM
  hosts: php
  become: true

  tasks:
    - name: Désactivation du service firewalld sur RedHat
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      when: ansible_facts.os_family == 'RedHat'

    - name: Installation de PHP-FPM
      ansible.builtin.package:
        name: "{{ php_package_name }}"

    - name: Configuration du service php-fpm
      ansible.builtin.systemd:
        name: "{{ php_service_name }}"
        state: started
        enabled: true

    - name: Template de la conf PHP
      ansible.builtin.template:
        src: php/www.conf
        dest: /etc/php-fpm.d/www.conf
      notify: restart_php
      tags: php

  handlers:
    - name: Restart php
      ansible.builtin.systemd:
        name: "{{ php_service_name }}"
        state: restarted
      listen: restart_php

- name: Fichiers de site
  hosts: www,php
  become: true

  tasks:
    - name: Copie des fichiers de site
      ansible.builtin.copy:
        src: lab-lempnet/html
        dest: /var/www/
