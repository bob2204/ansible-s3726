[defaults]
inventory          = inventaires
private_key_file   = sshkeys/ansible
interpreter_python = /usr/bin/python3
gathering               = smart
fact_caching            = redis
fact_caching_connection = 192.168.56.246:6379:0
fact_caching_timeout    = 86400
roles_path              = roles
retry_files_enabled     = true
retry_files_save_path   = retry.d
callbacks_enabled       = community.general.log_plays
# Pour la sortie stdout
#callback_result_format  = json ou yaml
#callback_format_pretty  = true

[privilege_escalation]
become      = false
become_user = root

[callback_log_plays]
log_folder = /home/stagiaire/ansible-s3726/log/ansible/hosts
